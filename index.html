<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>The Creative Transformation Award 2026 Virtual Exhibition</title>
    <!-- Inline style hides UI elements synchronously before any JS/CSS loads,
         preventing a flash of unstyled content. overlay.css will take over
         once the module bundle is evaluated. -->
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #f5f3ef; }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div class="menu" id="menu">
      <div class="menu-row">
        <div class="btn artwork-nav__prev" aria-label="Previous artwork">&#8592;</div>
        <div class="btn artwork-nav__list-btn" aria-label="All artworks">All works</div>
        <div class="btn artwork-nav__next" aria-label="Next artwork">&#8594;</div>
      </div>
      <div class="menu-divider"></div>
      <div class="menu-row">
        <div class="btn" data-loc="lobby">Lobby</div>
        <div class="btn" data-loc="WestPavillion">Pavilion</div>
        <div class="btn" data-loc="EagleBar">Eagle Bar</div>
        <!-- <div class="btn" data-loc="winners">Winners</div> -->
      </div>
    </div>

    <div id="info-panel" class="info-panel">
      <div class="info-panel__header">
        <div class="info-panel__title"></div>
        <button class="info-panel__close" aria-label="Close">&#10005;</button>
      </div>
      <div class="info-panel__artist"></div>
      <div class="info-panel__description"></div>
      <div class="info-panel__video">
        <button class="video-ctrl__playpause" aria-label="Play">&#9654;</button>
        <span class="video-ctrl__time">0:00</span>
        <input type="range" class="video-ctrl__scrubber" min="0" max="1" step="0.001" value="0">
        <span class="video-ctrl__duration">0:00</span>
      </div>
      <div class="info-panel__audio">
        <div class="info-panel__audio-controls">
          <button class="video-ctrl__playpause" aria-label="Play narration">&#9654;</button>
          <span class="video-ctrl__time">0:00</span>
          <input type="range" class="video-ctrl__scrubber" min="0" max="1" step="0.001" value="0">
          <span class="video-ctrl__duration">0:00</span>
        </div>
      </div>
    </div>

    <div id="artwork-list" class="artwork-list">
      <div class="artwork-list__header">
        <span class="artwork-list__heading">All Artworks</span>
        <button class="artwork-list__close" aria-label="Close list">&#10005;</button>
      </div>
      <div class="artwork-list__items"></div>
    </div>

    <div id="mobile-artwork-header" class="mobile-artwork-header">
      <div class="mobile-artwork-header__text">
        <div class="mobile-artwork-header__title"></div>
        <div class="mobile-artwork-header__artist"></div>
      </div>
      <button class="mobile-artwork-header__close" aria-label="Close">&#10005;</button>
    </div>

    <button id="carousel-prev" class="carousel-nav-btn carousel-nav-btn--prev" aria-label="Previous">&#8592;</button>
    <button id="carousel-next" class="carousel-nav-btn carousel-nav-btn--next" aria-label="Next">&#8594;</button>

    <!-- Portrait-only lock: shown on touch devices in landscape via CSS media query -->
    <div id="rotate-overlay" class="rotate-overlay" aria-live="polite">
      <div class="rotate-overlay__icon">
        <svg width="60" height="60" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <!-- phone body -->
          <rect x="18" y="8" width="24" height="40" rx="4" stroke="currentColor" stroke-width="2.5" fill="none"/>
          <!-- home indicator -->
          <line x1="26" y1="43" x2="34" y2="43" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          <!-- rotation arrow -->
          <path d="M10 38 A22 22 0 0 1 48 22" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none" stroke-dasharray="4 3"/>
          <polyline points="44,18 48,22 44,26" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
      </div>
      <p class="rotate-overlay__text">Rotate your device to portrait</p>
    </div>

    <!-- Main application script -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
